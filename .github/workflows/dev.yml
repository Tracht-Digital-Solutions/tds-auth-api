name: Dev bundle → dev branch

# Developer version: on every push to main, run the checks and assemble a
# self-contained production bundle, force-published to the orphan `dev` branch.
# NOT deployed - config lives in the host .env, so dev/release bundles are
# identical content; only release.yml (manual) deploys. Pipeline body in
# _pipeline.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bundle:
    uses: ./.github/workflows/_pipeline.yml
    with:
      php_extensions: openssl, pdo_mysql
      db_name: tds_auth_test
      publish_branch: dev
    secrets: inherit
