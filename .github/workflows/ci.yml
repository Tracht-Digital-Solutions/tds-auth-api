name: CI

# PR-only gate (push-to-main check + bundle is handled by dev.yml).
# Pipeline body in _pipeline.yml.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/_pipeline.yml
    with:
      php_extensions: openssl, pdo_mysql
      db_name: tds_auth_test
      run_db_tests: true
    secrets: inherit
