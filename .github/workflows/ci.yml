name: CI

on:
  # PR-only — push-to-main check + bundle is handled by dev.yml.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer install (cached)
        uses: ramsey/composer-install@v3

      - name: PHP syntax check
        run: |
          find src tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPUnit
        run: composer test
