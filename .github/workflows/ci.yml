name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find src tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPUnit
        # Integration tests skip without TDS_TEST_DB_DSN; the
        # pure-unit subset still runs. Future: add a MariaDB service
        # container and set TDS_TEST_DB_DSN to enable the rest.
        run: composer test

  deploy:
    # On a push to main (not PRs), after CI passes, ping the production
    # host's deploy hook so it pulls the new source and goes live. The
    # deploy token is carried inside DEPLOY_WEBHOOK_URL itself; the step
    # skips quietly when the secret isn't configured yet.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not set - skipping deploy ping."
            exit 0
          fi
          echo "Pinging deploy webhook..."
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 "$DEPLOY_WEBHOOK_URL"
          echo "Deploy webhook pinged."
