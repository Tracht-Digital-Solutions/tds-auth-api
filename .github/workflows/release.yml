name: Release bundle → release branch (manual)

# Production release, ONLY on the manual Actions button. Runs the full DB-backed
# test gate, assembles the self-contained bundle, force-publishes it to the
# orphan `release` branch, pings the deploy webhook (host pulls `release`), and
# tells the gateway to reassemble. Pipeline body in _pipeline.yml.

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/_pipeline.yml
    with:
      php_extensions: openssl, pdo_mysql
      db_name: tds_auth_test
      run_db_tests: true
      publish_branch: release
      deploy: true
      dispatch_gateway: true
    secrets: inherit
