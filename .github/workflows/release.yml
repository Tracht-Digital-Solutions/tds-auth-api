name: Release bundle → release branch (manual)

# Production release, ONLY on the manual Actions button. Assembles the same
# self-contained bundle, force-publishes it to the orphan `release` branch,
# pings the deploy webhook (host pulls `release`), and tells the gateway to
# reassemble. Replaces the old source-on-push deploy.

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Composer install (cached, with dev for tests)
        uses: ramsey/composer-install@v3

      - name: PHP syntax check
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: PHPUnit
        run: composer test

      - name: Assemble production bundle
        run: bash .github/assemble-bundle.sh release

      - name: Publish bundle to release branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          publish_branch: release
          commit_message: 'release ${{ github.sha }}'
          force_orphan: true

      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not set - skipping deploy ping."
            exit 0
          fi
          echo "Pinging deploy webhook..."
          # Plesk's git web-hook only answers POST (a bare GET 404s); -L follows
          # any panel redirect and re-POSTs. A failed ping still must not red the run.
          echo "POSTing deploy webhook to $(printf '%s' "$DEPLOY_WEBHOOK_URL" | cut -d/ -f1-3) ..."
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -L --post301 --post302 --post303 \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$DEPLOY_WEBHOOK_URL" || echo "000")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook pinged (HTTP $code)."
          else
            echo "::warning title=Deploy webhook failed::Webhook returned HTTP $code - host not notified. Check DEPLOY_WEBHOOK_URL."
          fi

      - name: Notify gateway to reassemble
        env:
          GATEWAY_DISPATCH_TOKEN: ${{ secrets.GATEWAY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GATEWAY_DISPATCH_TOKEN" ]; then
            echo "GATEWAY_DISPATCH_TOKEN not set - skipping gateway dispatch."
            exit 0
          fi
          echo "Dispatching api-pushed to tds-api-gateway..."
          curl -fsS -X POST \
            -H "Authorization: Bearer $GATEWAY_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Tracht-Digital-Solutions/tds-api-gateway/dispatches \
            -d "{\"event_type\":\"api-pushed\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}"
          echo "Gateway dispatch sent."
